<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != 'Inicio' %}{{ page.title }} — {% endif %}Nanitre · Daniela Trejo</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <meta name="theme-color" content="#f2efe8">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body class="page-{{ page.layout | default: 'default' }}">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <header class="site-header">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Nanitre, inicio">
      nanitre<span aria-hidden="true">®</span>
    </a>
    <nav class="main-nav" aria-label="Navegación principal">
      <a href="{{ '/portfolio/' | relative_url }}"{% if page.url contains '/obra/' or page.url contains '/portfolio' %} aria-current="page"{% endif %}>Obra</a>
      <a href="{{ '/perfil/' | relative_url }}"{% if page.url contains '/perfil' %} aria-current="page"{% endif %}>Artista</a>
      <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' %} aria-current="page"{% endif %}>Cuaderno</a>
    </nav>
    <a class="verify-link" href="{{ '/verificacion/' | relative_url }}"{% if page.url contains '/verificacion' %} aria-current="page"{% endif %}>Verificar <span aria-hidden="true">↗</span></a>
  </header>

  <main id="contenido">
    {{ content }}
  </main>

  <footer class="site-footer">
    <a class="footer-mark" href="{{ '/' | relative_url }}">nanitre.com</a>
    <div class="footer-nav">
      <a href="https://www.instagram.com/naniitre?igsh=MXA5dWx4czN4OGFtaw==" target="_blank" rel="noopener">Instagram ↗</a>
      <a href="https://patreon.com/Daniverso?utm_medium=clipboard_copy&utm_source=copyLink&utm_campaign=creatorshare_fan&utm_content=join_link" target="_blank" rel="noopener">Patreon ↗</a>
      <a href="mailto:{{ site.email }}">Contacto ↗</a>
    </div>
    <p>Daniela Trejo · Artes Visuales<br>© {{ "now" | date: "%Y" }} Todos los derechos reservados.</p>
  </footer>
</body>
</html>
