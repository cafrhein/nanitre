---
layout: default
---

<article class="post">
  <header>
    <p class="eyebrow">Cuaderno de estudio · {{ page.date | date: "%d · %m · %Y" }}</p>
    <h1>{{ page.title }}</h1>
  </header>

  <div class="post__content">{{ content }}</div>

  {% include author-signature.html %}

  <nav class="obra-back" aria-label="Volver al cuaderno">
    <a class="text-link" href="{{ '/blog/' | relative_url }}"><span aria-hidden="true">←</span> Volver al cuaderno</a>
  </nav>
</article>
